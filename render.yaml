# Aira AI — Render deployment (https://render.com)
# Two services: web (Next.js) and worker (FastAPI + APScheduler)
# Both read env vars from the Render dashboard. Database is Supabase (external).

services:
  - type: web
    name: aira-ai-web
    runtime: node
    rootDir: apps/web
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_URL
        value: https://aira-ai-worker.onrender.com
      - key: WORKER_INTERNAL_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Aira AI <hello@aira.example>
      - key: OPENAQ_KEY
        sync: false
      - key: WEB_URL
        value: https://aira-ai.onrender.com
    autoDeploy: true

  - type: web
    name: aira-ai-worker
    runtime: python
    rootDir: apps/worker
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        fromService: { name: aira-ai-web, type: web, env: NEXT_PUBLIC_SUPABASE_URL }
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Aira AI <hello@aira.example>
      - key: OPENAQ_KEY
        sync: false
      - key: WEB_URL
        value: https://aira-ai.onrender.com
      - key: WORKER_URL
        value: https://aira-ai-worker.onrender.com
      - key: WORKER_INTERNAL_TOKEN
        generateValue: true
    autoDeploy: true
