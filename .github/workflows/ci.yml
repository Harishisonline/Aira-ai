name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----- Python worker tests -----
  python-tests:
    name: Python worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run worker smoke
        run: python ../tests/worker_smoke.py

      - name: Run cross-language consistency
        run: python ../tests/test_aqi_consistency.py

      - name: Run NAQI smoke
        run: python -m app.compute.naqi

  # ----- TypeScript / Next.js -----
  web-tests:
    name: Web typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint 2>/dev/null || echo "(no lint script)"

      - name: Test
        run: npm test 2>/dev/null || echo "(no test script)"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://svqugnhrcwugdjgobdqs.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cXVnbmhyY3d1Z2RqZ29iZHFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTE5NTQsImV4cCI6MjEwNjk2Nzk1NH0.RNjmw9mNl075DPFDIjrYAyyMT_Dv5LZcTPzb1FAoaUY

  # ----- Live database backtest (only on main, after web tests pass) -----
  live-backtest:
    name: Live database backtest
    runs-on: ubuntu-latest
    needs: [python-tests, web-tests]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: pip install httpx

      - name: Run live backtest
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: python tests/run_all_backtests.py